<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="ui.css" />
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <div class="wrap">
      <header class="head">
        <div>
          <div class="eyebrow" id="dateLabel">today</div>
          <div class="total num" id="total">0m</div>
        </div>
        <div class="now" id="nowBox" hidden>
          <div class="eyebrow">now</div>
          <div class="now-host" id="nowHost"></div>
          <div class="now-time num" id="nowTime"></div>
        </div>
      </header>

      <!-- Signature element: the day as 24 hourly columns -->
      <section class="strip-box">
        <div class="strip" id="strip"></div>
        <div class="ticks">
          <span>00</span><span>06</span><span>12</span><span>18</span><span>24</span>
        </div>
      </section>

      <hr class="rule" />

      <section class="list" id="list"></section>

      <footer class="foot">
        <button id="pause">Pause</button>
        <button id="stats" class="primary">Stats &amp; history</button>
      </footer>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
